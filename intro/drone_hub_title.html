<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drone &amp; Robotics Hub 2.0</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #02050c; overflow: hidden; }
  /* The opening title scene of the showcase video as a looping GIF: the first
     screen of the show and the closing screen. Fills the width, centred. */
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<img src="/intro/drone_hub_title.gif" alt="Drone &amp; Robotics Hub 2.0" id="g">
<script>
  // screen.html fades this page in once __ready is set (the GIF has loaded).
  const g = document.getElementById('g');
  const ready = () => { window.__ready = true; };
  if (g.complete) ready(); else { g.addEventListener('load', ready); g.addEventListener('error', ready); }
</script>
</body>
</html>
