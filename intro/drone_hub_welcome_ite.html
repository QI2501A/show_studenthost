  // layout: [ logo ]  gap  [ title ], centred as a group
  const LOGO_H = H * 0.54, LOGO_W = LOGO_H * 459 / 439;
  const TEXT_W = W * 0.64, GAP = 230;
  const GROUP_W = LOGO_W + GAP + TEXT_W;
  const LOGO_X = (W - GROUP_W) / 2, TEXT_CX = LOGO_X + LOGO_W + GAP + TEXT_W / 2;

  const params = new URLSearchParams(location.search);
  const FULL = params.has('full');

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let S = 1;

  function resize() {
    const cssW = FULL ? W : canvas.parentElement.clientWidth;
    S = FULL ? 1 : Math.min(1, cssW * (window.devicePixelRatio || 1) / W);
    canvas.width = Math.round(W * S);
    canvas.height = Math.round(H * S);

  /* ---------- helpers ---------- */
  function mulberry32(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(2024);
  const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const ease = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const mod1 = t => t - Math.floor(t);

  /* ---------- sample the logo + text into drone target points ---------- */
  let drones = [];

  // hex-packed grid sampler; calls pick(x, y) -> null | kind
  function sampleGrid(data, step, pick) {
    const out = [];
    const rowStep = step * 0.87;
    let row = 0;
    for (let y = rowStep; y < H; y += rowStep, row++) {
      for (let x = (row % 2 ? step / 2 : 0); x < W; x += step) {
        const i = ((y | 0) * W + (x | 0)) * 4;
        const kind = pick(data[i], data[i + 1], data[i + 2], data[i + 3]);
        if (kind) out.push({ x, y, kind });
      }
    }
    return out;
  }

  async function buildDrones() {
    const mk = () => {
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      return c.getContext('2d', { willReadFrequently: true });
    };

    // text
    const o = mk();
    const font = s => `800 ${s}px "Avenir Next", "Helvetica Neue", "Segoe UI", Arial, sans-serif`;
    let size = 300;
    o.font = font(size);
    size *= TEXT_W / o.measureText(LABEL).width;
    o.font = font(size);
    o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
    o.fillText(LABEL, TEXT_CX, CY);
    const total = o.measureText(LABEL).width;
    const accentX = TEXT_CX - total / 2 + o.measureText('Welcome to Drone Hub ').width;
    const textPts = sampleGrid(o.getImageData(0, 0, W, H).data, 15, (r, g, b, a) => a > 140 ? 'text' : null);

    // logo
    const img = new Image();
    img.src = LOGO_SRC;
    await img.decode();
    const l = mk();
    l.drawImage(img, LOGO_X, CY - LOGO_H / 2, LOGO_W, LOGO_H);
    const logoPts = sampleGrid(l.getImageData(0, 0, W, H).data, 17,
      (r, g, b, a) => a < 140 ? null : (g > 150 ? 'logo-white' : 'logo-red'));

    logoPts.sort((a, b) => (a.kind === 'logo-red' ? 0 : 1) - (b.kind === 'logo-red' ? 0 : 1));
    const pts = logoPts.concat(textPts);
    const minX = Math.min(...pts.map(p => p.x));
    const maxX = Math.max(...pts.map(p => p.x));

    drones = pts.map(p => ({
      tx: p.x, ty: p.y,
      kind: p.kind,
      accent: p.kind === 'text' && p.x >= accentX,
      d: (p.x - minX) / (maxX - minX),              // 0..1 left-to-right, staggers the wave
      bx: rnd() * W,
      by: H * (0.07 + rnd() * 0.62),
      ax: 60 + rnd() * 220, ay: 40 + rnd() * 110,
      fx: 1 + ((rnd() * 2) | 0), fy: 1 + ((rnd() * 3) | 0),
      px: rnd() * TAU, py: rnd() * TAU, pp: rnd() * TAU,
      curve: (rnd() - .5) * 520,
      ambient: false,
    }));

    // ambient drones that never join the formation (kept in bands above/below it)
    for (let i = 0; i < 260; i++) {
      const top = rnd() < .55;
      drones.push({
        tx: 0, ty: 0, kind: 'ambient', accent: false, d: 0,
        bx: rnd() * W,
        by: top ? H * (0.03 + rnd() * 0.12) : H * (0.64 + rnd() * 0.12),
        ax: 40 + rnd() * 160, ay: 20 + rnd() * 60,
        fx: 1 + ((rnd() * 2) | 0), fy: 1 + ((rnd() * 3) | 0),
        px: rnd() * TAU, py: rnd() * TAU, pp: rnd() * TAU,
        curve: 0, ambient: true,
      });
    }
    console.log('drones: logo', logoPts.length, '+ text', textPts.length, '+', drones.length - pts.length, 'ambient');
  }

  const stars = Array.from({ length: 700 }, () => ({

    r: 1.5 + rnd() * 3, k: 1 + ((rnd() * 3) | 0), ph: rnd() * TAU,
  }));

  /* ---------- glow sprites (cached by hue + style) ---------- */
  // level 0-2: coloured glow, increasingly white   3: pure white   4: solid colour (no white core)
  const sprites = new Map();
  function sprite(hue, level) {
    const key = hue + '_' + level;
    let c = sprites.get(key);
    if (c) return c;
    const n = 96, r = n / 2;
    c = document.createElement('canvas'); c.width = c.height = n;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    if (level === 4) {
      grad.addColorStop(0.00, 'rgba(200,16,46,1)');
      grad.addColorStop(0.42, 'rgba(200,16,46,1)');
      grad.addColorStop(0.70, 'rgba(200,16,46,.35)');
      grad.addColorStop(1.00, 'rgba(200,16,46,0)');
    } else {
      const sat = [100, 80, 40, 0][level], lum = [62, 74, 88, 100][level];
      const haloSat = level === 3 ? 0 : 100, haloLum = level === 3 ? 85 : 55;
      grad.addColorStop(0.00, 'rgba(255,255,255,1)');
      grad.addColorStop(0.13, 'rgba(255,255,255,.95)');
      grad.addColorStop(0.26, `hsla(${hue},${sat}%,${lum}%,.85)`);
      grad.addColorStop(0.55, `hsla(${hue},${haloSat}%,${haloLum}%,.20)`);
      grad.addColorStop(1.00, `hsla(${hue},${haloSat}%,${haloLum}%,0)`);

    { x: .08, ph: 0,   f: 1, hue: 190, sp: .05 },
    { x: .30, ph: .33, f: 2, hue: 280, sp: .04 },
    { x: .52, ph: .60, f: 1, hue: 200, sp: .06 },
    { x: .74, ph: .15, f: 2, hue: 300, sp: .04 },
    { x: .93, ph: .80, f: 1, hue: 185, sp: .05 },
  ];
  function drawBeams(t) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1 - 0.45 * env(.5, t);     // calm the beams while the formation holds
    for (const b of BEAMS) {
      const x0 = b.x * W, y0 = HY, len = H * 1.15;
      const a = -Math.PI / 2 + 0.42 * Math.sin(TAU * (b.f * t + b.ph));
      const tx = x0 + Math.cos(a) * len, ty = y0 + Math.sin(a) * len;
      const nx = -Math.sin(a), ny = Math.cos(a), sp = b.sp * len;
      const g = ctx.createLinearGradient(x0, y0, tx, ty);
      g.addColorStop(0, `hsla(${b.hue},100%,70%,.28)`);
      g.addColorStop(.6, `hsla(${b.hue},100%,60%,.06)`);
      g.addColorStop(1, `hsla(${b.hue},100%,60%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x0 - nx * 6, y0 - ny * 6);
      ctx.lineTo(tx + nx * sp, ty + ny * sp);
      ctx.lineTo(tx - nx * sp, ty - ny * sp);
      ctx.lineTo(x0 + nx * 6, y0 + ny * 6);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const P = { x: 0, y: 0, e: 0 }, Q = { x: 0, y: 0, e: 0 };
  function drawDrones(t) {
    ctx.globalCompositeOperation = 'lighter';
    const xs = W * (-0.1 + 1.2 * clamp01((t - 0.36) / 0.34));     // shimmer sweeping across the held formation

    for (const d of drones) {
      pos(d, t, P);
      const e = P.e;
      const wave = 0.5 + 0.5 * Math.sin(TAU * (P.x / W * 1.3 - t));
      const flightHue = 175 + 135 * wave;
      let hue, level = 0, size, alpha, solid = 0;

      if (d.ambient) {
        const tw = 0.5 + 0.5 * Math.sin(TAU * d.fx * 2 * t + d.py);
        hue = 185 + 120 * wave;
        alpha = 0.35 + 0.4 * tw;
        size = 22 + 8 * tw;
      } else if (d.kind === 'text') {
        const sw = Math.exp(-Math.pow((P.x - xs) / 240, 2));
        const wh = e * 0.35 + sw * e * 0.65;
        level = wh < .3 ? 0 : wh < .6 ? 1 : 2;
        hue = d.accent ? 28 + 24 * wave : flightHue;
        alpha = 0.78 + 0.22 * e;
        size = 30 + 14 * e + 10 * sw * e + 3 * e * Math.sin(TAU * 6 * t + d.pp);
      } else {
        // logo: drones blend from the swarm colours into ITE red / white as they arrive
        const sw = Math.exp(-Math.pow((P.x - xs) / 240, 2));
        hue = flightHue * (1 - e) + 350 * e;
        if (d.kind === 'logo-white') level = e > .85 ? 3 : e > .5 ? 2 : e > .25 ? 1 : 0;
        solid = d.kind === 'logo-red' ? clamp01((e - 0.5) / 0.4) : 0;   // 0 = swarm glow, 1 = solid ITE red
        alpha = (0.78 + 0.22 * e) * (1 - solid);
        size = 30 + 16 * e + 8 * sw * e + 2 * e * Math.sin(TAU * 6 * t + d.pp);
      }
      const spr = sprite(Math.round(hue / 8) * 8, level);

      // trails while in flight
      if (!d.ambient && e > 0.001 && e < 0.999) {
        for (let k = 1; k <= 3; k++) {
          pos(d, t - 0.006 * k, Q);
          ctx.globalAlpha = alpha * 0.28 / k;
          const s2 = size * 0.7;
          ctx.drawImage(spr, Q.x - s2 / 2, Q.y - s2 / 2, s2, s2);
        }
      }

      ctx.globalAlpha = alpha;
      ctx.drawImage(spr, P.x - size / 2, P.y - size / 2, size, size);

      if (solid > 0) {
        const sol = sprite(352, 4), ss = size * 1.25;
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = solid;
        ctx.drawImage(sol, P.x - ss / 2, P.y - ss / 2, ss, ss);
        if (P.y < HY - 10) {
          const ry = 2 * HY - P.y;
          ctx.globalAlpha = solid * 0.13;
          ctx.drawImage(sol, P.x - ss / 2, ry - ss * 0.5, ss, ss * 1.9);
        }
        ctx.globalCompositeOperation = 'lighter';
      }

      // water reflection
      if (P.y < HY - 10) {
        const ry = 2 * HY - P.y;
        if (ry < H + size) {
          ctx.globalAlpha = alpha * 0.16;
          ctx.drawImage(spr, P.x + 5 * Math.sin(TAU * 3 * t + P.y * 0.04) - size / 2, ry - size * 0.5, size, size * 1.9);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function frame(t) {
    t = mod1(t);
    ctx.setTransform(S, 0, 0, S, 0, 0);
    drawBackground(t);
    drawBeams(t);
    drawDrones(t);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- run ---------- */
  window.renderAt = t => frame(t);               // for frame-by-frame export: renderAt(0 .. 1)
  window.LOOP_SECONDS = LOOP;

  let clock = 0, last = performance.now(), paused = false;
  const fixed = params.has('t') ? parseFloat(params.get('t')) : null;

  function tick(now) {
    if (!paused) clock += (now - last) / 1000;
    last = now;
    frame(clock / LOOP);
    requestAnimationFrame(tick);
  }

  document.fonts.ready.then(async () => {
    resize();
    await buildDrones();
    window.addEventListener('resize', () => { resize(); if (fixed !== null) frame(fixed); });
    window.addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; e.preventDefault(); } });
    if (fixed !== null) frame(fixed); else requestAnimationFrame(tick);
    window.__ready = true;
  });
})();
</script>
</body>
</html>
