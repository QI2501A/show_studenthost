<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Show Host — Chatbot Channel</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
<style>
  :root {
    --fg: #00ff41;
    --fg-glow: rgba(0, 255, 65, 0.55);
    --border: #003b0f;
    --panel-glow: rgba(0, 255, 65, 0.12);
  }
  body[data-theme="red"] {
    --fg: #ff3b30;
    --fg-glow: rgba(255, 59, 48, 0.6);
    --border: #3b0000;
    --panel-glow: rgba(255, 59, 48, 0.16);
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas#rain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* --- Terminal-styled panel shell, shared by the two response panels --- */
  .panel {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    max-height: 78vh;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid var(--border);
    box-shadow: 0 0 60px var(--panel-glow) inset;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    transition: border-color 0.4s, box-shadow 0.4s;
  }
  .term-titlebar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 13px 20px;
    border-bottom: 1px solid var(--border);
    font-family: Menlo, Consolas, "Courier New", monospace;
    font-size: 18px; /* 1.5x the original 12px, like the panel text below */
    letter-spacing: 0.5px;
    color: var(--fg);
    opacity: 0.7;
  }
  .term-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--fg);
    opacity: 0.5;
  }
  .term-title { margin-left: 4px; }
  .term-body {
    flex: 1 1 auto;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 20px 24px;
    font-family: Menlo, Consolas, "Courier New", monospace;
    line-height: 1.5;
    color: var(--fg);
    text-shadow: 0 0 6px var(--fg-glow);
    white-space: pre-wrap;
  }

  /* Centre: the chatbot's own answers — the main event. */
  /* Sits left of centre (44%) so the now-larger skull has room on the right. */
  #panel {
    left: 44%;
    transform: translate(-50%, -50%);
    width: 34vw;
    min-width: 300px;
    max-width: 680px;
  }
  /* Text is 1.5x the original size (was clamp(15px, 1.5vw, 24px)). */
  #panel .term-body { font-size: clamp(22px, 2.25vw, 36px); }
  #cursor {
    display: inline-block;
    width: 0.55em;
    background: var(--fg);
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Left: what the mic hears the student say -- a secondary log, smaller. */
  #heardPanel {
    left: 2%;
    width: 21vw;
    min-width: 240px;
    max-width: 420px;
    opacity: 0.85;
  }
  /* Text is 1.5x the original size (was clamp(12px, 1.05vw, 17px)). */
  #heardPanel .term-body { font-size: clamp(18px, 1.575vw, 25.5px); opacity: 0.9; }

  /* Right third: the humanoid head -- a Three.js digital-rain skull built
     in a separate session (js/skull/skullApp.js), mounted into this
     container below. Its own <canvas> fills this box; initSkull() reads
     clientWidth/clientHeight from it, so the size/position live here. */
  /* About 2x the original (340x453 on a 1920-wide screen -> 690x920): sized by
     height so it never outgrows a short screen, width follows the 3:4 ratio. */
  #headContainer {
    position: fixed;
    right: 1.5%;
    top: 50%;
    transform: translateY(-50%);
    height: min(88vh, 920px);
    aspect-ratio: 3 / 4;
    box-sizing: border-box;
    overflow: hidden;
    /* No CSS blur here — the skull mesh now has a real WebGL bloom pass
       (see skullApp.js's EffectComposer/UnrealBloomPass) that glows the
       bright digit glyphs and rim highlights per-pixel. A CSS filter on
       top of that would blur the whole element uniformly again, right
       back to washing out the (now genuinely black) eye sockets. */
  }
  /* The stock UnrealBloomPass writes alpha=1 across the whole target, so the
     canvas is opaque even though the clear colour is transparent. "screen"
     blending treats black as see-through and adds the glow on top of the
     digital rain, so no rectangle shows behind the head. The blend must sit
     on the container itself: its transform makes it a stacking context, so
     a blend mode on the inner canvas would only see a transparent backdrop. */
  #headContainer { mix-blend-mode: screen; }
  #headContainer canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  #showVideo {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  #startOverlay {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    cursor: pointer;
  }
  #startOverlay .msg {
    font-family: Menlo, Consolas, "Courier New", monospace;
    color: #00ff41;
    text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
    font-size: clamp(18px, 3vw, 32px);
    text-align: center;
    border: 1px solid #00ff41;
    padding: 28px 44px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.55; } }

  #overrideHint {
    position: fixed;
    right: 18px;
    bottom: 14px;
    z-index: 500;
    font-family: Menlo, Consolas, "Courier New", monospace;
    font-size: 12px;
    color: var(--fg);
    opacity: 0.22;
    cursor: pointer;
    user-select: none;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    transition: opacity 0.15s;
  }
  #overrideHint:hover { opacity: 0.6; }
  #overrideHint.flash { opacity: 1; color: var(--fg); }

  /* --- OVERRIDE: a movie-style "key in the code" prompt, red-phase only --- */
  #overrideCommand {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    z-index: 500;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: Menlo, Consolas, "Courier New", monospace;
    color: #ff3b30;
    background: rgba(0, 0, 0, 0.72);
    border: 1px solid #ff3b30;
    border-radius: 6px;
    padding: 14px 32px 12px;
    animation: overridePulse 1.6s ease-in-out infinite;
  }
  #overrideCommand.active { display: flex; }
  @keyframes overridePulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255, 59, 48, 0.4); }
    50% { box-shadow: 0 0 24px rgba(255, 59, 48, 0.85); }
  }
  .oc-label {
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0.85;
  }
  .oc-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 19px;
  }
  .oc-prompt { opacity: 0.8; }
  #overrideInput {
    background: transparent;
    border: none;
    border-bottom: 2px solid #ff3b30;
    outline: none;
    color: #ff3b30;
    font: inherit;
    letter-spacing: 5px;
    text-transform: uppercase;
    text-align: center;
    width: 230px;
    text-shadow: 0 0 8px rgba(255, 59, 48, 0.6);
    caret-color: #ff3b30;
  }
  .oc-status {
    font-size: 11px;
    letter-spacing: 2px;
    min-height: 13px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .oc-status.show { opacity: 1; }
</style>
</head>
<body>
  <canvas id="rain"></canvas>

  <div class="panel" id="heardPanel">
    <div class="term-titlebar">
      <span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span>
      <span class="term-title">mic@dronehub-hub:~#</span>
    </div>
    <div class="term-body" id="heardBody"><span id="heardOutput"></span></div>
  </div>

  <div class="panel" id="panel">
    <div class="term-titlebar">
      <span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span>
      <span class="term-title">chatbot@dronehub-hub:~#</span>
    </div>
    <div class="term-body" id="termBody"><span id="output"></span><span id="cursor">&nbsp;</span></div>
  </div>

  <div id="headContainer"></div>

  <video id="showVideo" playsinline></video>
  <audio id="rogueMusic" loop preload="none"></audio>

  <div id="startOverlay"><div class="msg">&gt; CLICK TO ACTIVATE SYSTEM CHANNEL<br>(enters full-screen)</div></div>
  <div id="overrideHint" title="Manual override: confirms the current cue if voice wasn't detected">SPACE = confirm cue</div>
  <div id="overrideCommand">
    <div class="oc-label">SYSTEM OVERRIDE — ENTER CODE</div>
    <div class="oc-line">
      <span class="oc-prompt">&gt;</span>
      <input id="overrideInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40">
    </div>
    <div class="oc-status" id="overrideStatus">ACCESS DENIED</div>
  </div>

  <script>
    // A page can't put itself into full-screen on load — browsers require an
    // actual click first. This overlay makes that one optional click obvious
    // if the window isn't already full-screen (e.g. kiosk mode failed to
    // launch). It must NOT stay up if nobody clicks it, though — when kiosk
    // mode *did* launch, no click is coming, and this would otherwise sit on
    // top of the chatbot text and video forever. So it auto-dismisses on its
    // own after a few seconds either way. This click is also what typically
    // "unlocks" audio autoplay (background music) for the rest of the
    // page's life, in browsers that require a user gesture.
    const startOverlay = document.getElementById('startOverlay');
    function dismissOverlay() {
      startOverlay.style.display = 'none';
    }
    startOverlay.addEventListener('click', () => {
      const el = document.documentElement;
      const request = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (request) request.call(el).catch(() => {});
      dismissOverlay();
    });
    setTimeout(dismissOverlay, 6000);
  </script>
  <script>
    // --- Manual override, triggered from THIS screen ---
    // This is what the operator is actually looking at for nearly the whole
    // show (the kiosk browser window has focus, not the hidden terminal
    // behind it), so the override needs to be reachable from right here,
    // not only via a keypress at a terminal window that may never have
    // focus. SPACE (or ENTER), or a tap on the corner hint, posts /override;
    // Dialogue.py's wait_for_line/wait_for_keyword poll for it and treat it
    // exactly like a manual "yes, move on" confirmation.
    const overrideHint = document.getElementById('overrideHint');
    let overrideInFlight = false;
    function sendOverride() {
      if (overrideInFlight) return;
      overrideInFlight = true;
      overrideHint.classList.add('flash');
      fetch('/override', { method: 'POST' })
        .catch(() => {})
        .finally(() => {
          setTimeout(() => { overrideHint.classList.remove('flash'); overrideInFlight = false; }, 300);
        });
    }
    document.addEventListener('keydown', (e) => {
      if (e.target && e.target.id === 'overrideInput') return; // typing the OVERRIDE code, not a cue-confirm
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        sendOverride();
      }
    });
    overrideHint.addEventListener('click', sendOverride);

    // --- OVERRIDE: key in the code, like a movie override panel ---
    // Only shown once the screen is red. Not a button — the student types
    // the actual OVERRIDE keyword into this field and presses Enter; the
    // text is validated server-side in Dialogue.py's run_override() exactly
    // like the terminal path is, so a wrong code is rejected the same way.
    const overrideCommandEl = document.getElementById('overrideCommand');
    const overrideInputEl = document.getElementById('overrideInput');
    const overrideStatusEl = document.getElementById('overrideStatus');
    function submitOverrideCode() {
      const text = overrideInputEl.value;
      if (!text.trim()) return;
      fetch('/confirm-override-command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      }).catch(() => {});
      overrideInputEl.value = '';
    }
    overrideInputEl.addEventListener('keydown', (e) => {
      e.stopPropagation(); // don't let this typing also fire the SPACE/ENTER cue-confirm above
      if (e.key === 'Enter') {
        e.preventDefault();
        submitOverrideCode();
      }
    });
  </script>
  <script>
    // --- Digital rain background ---
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    let drops = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const cols = Math.floor(canvas.width / 18);
      drops = new Array(cols).fill(0).map(() => Math.floor(Math.random() * -40));
    }
    window.addEventListener('resize', resize);
    resize();

    const glyphs = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let rainColor = '#00ff41';
    function drawRain() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = rainColor;
      ctx.font = '16px monospace';
      for (let i = 0; i < drops.length; i++) {
        const glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
        ctx.fillText(glyph, i * 18, drops[i] * 18);
        if (drops[i] * 18 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawRain, 60);

    // --- Typewriter display (chatbot's own answers), driven by /state ---
    const outputEl = document.getElementById('output');
    const panelEl = document.getElementById('panel');
    const termBodyEl = document.getElementById('termBody');
    const heardPanelEl = document.getElementById('heardPanel');
    const heardOutputEl = document.getElementById('heardOutput');
    const heardBodyEl = document.getElementById('heardBody');
    const headContainerEl = document.getElementById('headContainer');
    const videoEl = document.getElementById('showVideo');
    const PARAGRAPH_PAUSE_MS = 1100; // matches Voice.PARAGRAPH_PAUSE_S in Dialogue.py
    const MIN_CHAR_MS = 18;   // never type faster than this, even for a very long line
    const MAX_CHAR_MS = 90;   // never type slower than this, even for a very short line

    let lastSeq = -1;
    let lastClearSeq = -1;
    let lastHeardSeq = -1;
    let lastOverrideFeedbackSeq = -1;
    let queue = [];
    let typing = false;
    let rateWpm = 165;
    let mode = 'chat';
    let currentTheme = 'green';
    const THEME_RAIN_COLORS = { green: '#00ff41', red: '#ff3b30' };

    function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

    // --- Rogue-phase background music ---
    // Prefers a real licensed track (server-configured via config.yaml's
    // rogue_music, served at /music) if one exists; otherwise synthesizes an
    // ominous drone with the Web Audio API so the effect works with no file
    // at all. Starts the instant the screen turns red, stops the instant it
    // turns back to green (OVERRIDE confirmed).
    const rogueMusicEl = document.getElementById('rogueMusic');
    let hasMusicFile = false;
    let musicSrcSet = false;
    let synthCtx = null;
    let synthNodes = null;

    function startMenacingMusic() {
      if (hasMusicFile) {
        if (!musicSrcSet) { rogueMusicEl.src = '/music'; musicSrcSet = true; }
        rogueMusicEl.currentTime = 0;
        rogueMusicEl.volume = 0.5;
        rogueMusicEl.play().catch(() => {});
        return;
      }
      if (synthCtx) return;
      try {
        synthCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = synthCtx.currentTime;
        const master = synthCtx.createGain();
        master.gain.setValueAtTime(0, now);
        master.gain.linearRampToValueAtTime(0.3, now + 1.5);
        master.connect(synthCtx.destination);

        const drone = synthCtx.createOscillator();
        drone.type = 'sawtooth';
        drone.frequency.value = 55; // low ominous drone
        const droneFilter = synthCtx.createBiquadFilter();
        droneFilter.type = 'lowpass';
        droneFilter.frequency.value = 280;
        drone.connect(droneFilter).connect(master);
        drone.start();

        const pulseOsc = synthCtx.createOscillator();
        pulseOsc.type = 'sine';
        pulseOsc.frequency.value = 110;
        const pulseGain = synthCtx.createGain();
        pulseGain.gain.value = 0;
        pulseOsc.connect(pulseGain).connect(master);
        pulseOsc.start();

        const pulseTimer = setInterval(() => {
          if (!synthCtx) { clearInterval(pulseTimer); return; }
          const t = synthCtx.currentTime;
          pulseGain.gain.cancelScheduledValues(t);
          pulseGain.gain.setValueAtTime(0.3, t);
          pulseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        }, 700);

        synthNodes = { master, drone, pulseOsc, pulseTimer };
      } catch (e) {
        // Web Audio unsupported/blocked -- show still runs silently
      }
    }

    function stopMenacingMusic() {
      if (hasMusicFile) {
        rogueMusicEl.pause();
        return;
      }
      if (!synthCtx) return;
      const ctxRef = synthCtx;
      const nodes = synthNodes;
      const now = ctxRef.currentTime;
      try {
        nodes.master.gain.cancelScheduledValues(now);
        nodes.master.gain.setValueAtTime(nodes.master.gain.value, now);
        nodes.master.gain.linearRampToValueAtTime(0, now + 0.8);
        clearInterval(nodes.pulseTimer);
        setTimeout(() => {
          try { nodes.drone.stop(); nodes.pulseOsc.stop(); ctxRef.close(); } catch (e) {}
        }, 900);
      } catch (e) {
        // ignore -- worst case the drone keeps ringing briefly
      }
      synthCtx = null;
      synthNodes = null;
    }

    // --- Rogue-phase sirens ---
    // Layered on top of the drone/music for the whole red phase: two
    // detuned wailing sirens and a two-tone "nee-naw" alarm form a constant
    // bed, and a scheduler throws random one-shots over it -- bursts, pitch
    // dives, rising whoops, rapid alarm trains, static, stutters, at random
    // pitches and stereo positions. The scheduler gets busier the longer the
    // takeover lasts, so it builds into chaos instead of sitting at one
    // volume. Everything runs through a distortion stage and a compressor
    // so it stays harsh without clipping. Ducked while the chatbot speaks or
    // a video plays (see setSirenDuck) so the voice and video stay audible.
    let sirenCtx = null;
    let sirenNodes = null;
    const SIREN_LEVEL = 0.26; // overall loudness ceiling (before ducking); overlapping hits spike well above the average

    // The voice has to win. The chatbot's speech is played by Dialogue.py
    // through the same speakers, so the sirens can only get out of its way:
    // while it speaks they drop to ~12% (about -18 dB), and they stay down for
    // a beat after each sentence so they don't swell back between words. A
    // video's own soundtrack gets a gentler duck.
    const SIREN_DUCK_SPEECH = 0.12;
    const SIREN_DUCK_VIDEO = 0.3;
    let sirenDuckUntil = 0;
    let sirenVideoDuck = false;
    function setSirenDuck(speaking, video) {
      if (speaking) sirenDuckUntil = performance.now() + 900;
      sirenVideoDuck = !!video;
    }
    function currentSirenDuck() {
      if (performance.now() < sirenDuckUntil) return SIREN_DUCK_SPEECH;
      return sirenVideoDuck ? SIREN_DUCK_VIDEO : 1;
    }

    // Builds one siren audio chain (master gain -> soft-clip distortion ->
    // compressor -> speakers) plus the one-shot sound makers both the
    // takeover sirens and the dying sirens use.
    function makeSirenChain() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});

      const master = ctx.createGain();
      master.gain.value = 0;
      const shaper = ctx.createWaveShaper();
      const curve = new Float32Array(2048);
      for (let i = 0; i < curve.length; i++) {
        const x = (i / (curve.length - 1)) * 2 - 1;
        curve[i] = (1 + 6) * x / (1 + 6 * Math.abs(x)); // soft-clip: harsher, not louder
      }
      shaper.curve = curve;
      const comp = ctx.createDynamicsCompressor();
      // `out` is the LAST stage, after the distortion and compressor, and is
      // what the voice-ducking drives. Ducking `master` instead (before the
      // soft-clipper) barely works: the clipper has high gain on quiet signals
      // and hands most of the lost level straight back.
      const out = ctx.createGain();
      out.gain.value = 1;
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 256;
      master.connect(shaper); shaper.connect(comp); comp.connect(out);
      out.connect(ctx.destination); out.connect(analyser);

      const route = (node, panValue) => {
        if (ctx.createStereoPanner) {
          const p = ctx.createStereoPanner(); p.pan.value = panValue;
          node.connect(p); p.connect(master);
        } else {
          node.connect(master);
        }
      };
      const rand = (lo, hi) => lo + Math.random() * (hi - lo);

      // Shared white-noise buffer for the static bursts.
      const noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

      function beep(freq, dur, type, gain, panV) {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(gain, t + 0.008);
        g.gain.setValueAtTime(gain, t + Math.max(0.01, dur - 0.02));
        g.gain.linearRampToValueAtTime(0.0001, t + dur);
        o.connect(g); route(g, panV);
        o.start(t); o.stop(t + dur + 0.02);
      }
      function sweep(f0, f1, dur, type, gain, panV) {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(); o.type = type;
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(gain, t + 0.04);
        g.gain.linearRampToValueAtTime(0.0001, t + dur);
        o.connect(g); route(g, panV);
        o.start(t); o.stop(t + dur + 0.02);
      }
      function noiseBurst(dur, gain, panV) {
        const t = ctx.currentTime;
        const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
        bp.frequency.setValueAtTime(rand(400, 5000), t);
        bp.frequency.exponentialRampToValueAtTime(rand(300, 6000), t + dur);
        bp.Q.value = rand(1, 8);
        const g = ctx.createGain();
        g.gain.setValueAtTime(gain, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(bp); bp.connect(g); route(g, panV);
        src.start(t, rand(0, 0.5)); src.stop(t + dur + 0.02);
      }
      return { ctx, master, out, analyser, route, rand, beep, sweep, noiseBurst };
    }

    function startRogueSirens() {
      if (sirenCtx) return;
      try {
        const { ctx, master, out, analyser, route, rand, beep, sweep, noiseBurst } = makeSirenChain();
        sirenCtx = ctx;
        const startedAt = ctx.currentTime;

        // Bed 1 & 2: wailing sirens, each pitch-swept by its own LFO.
        const wails = [];
        [[850, 380, 0.4, -0.5, 0.5], [610, 260, 0.63, 0.5, 0.32], [1300, 420, 1.1, 0, 0.2]].forEach(([base, depth, rate, panV, gain]) => {
          const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = base;
          const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = rate;
          const lfoGain = ctx.createGain(); lfoGain.gain.value = depth;
          lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
          const g = ctx.createGain(); g.gain.value = gain;
          osc.connect(g); route(g, panV);
          osc.start(); lfo.start();
          wails.push({ osc, lfo, lfoGain });
        });

        // Bed 3: two-tone alarm, retuned on a schedule by the tick below.
        const twoTone = ctx.createOscillator(); twoTone.type = 'square'; twoTone.frequency.value = 960;
        const twoToneGain = ctx.createGain(); twoToneGain.gain.value = 0.16;
        twoTone.connect(twoToneGain); route(twoToneGain, 0);
        twoTone.start();
        let twoToneNext = ctx.currentTime;
        let twoToneHigh = true;

        // One-shot sound makers (beep/sweep/noiseBurst come from makeSirenChain) --
        function alarmTrain(panV) {
          const f = Math.random() < 0.5 ? 880 : 1320;
          const n = 4 + Math.floor(Math.random() * 6);
          const gap = rand(0.07, 0.11);
          for (let k = 0; k < n; k++) {
            setTimeout(() => { if (sirenCtx === ctx) beep(f, gap * 0.6, 'square', 0.3, panV); }, k * gap * 1000);
          }
        }
        function stutter(panV) {
          const f = rand(180, 520);
          const steps = 6 + Math.floor(Math.random() * 8);
          for (let k = 0; k < steps; k++) {
            setTimeout(() => { if (sirenCtx === ctx) beep(f * (1 + (k % 3) * 0.5), 0.022, 'sawtooth', 0.4, panV); }, k * 38);
          }
        }
        // Glitchy machine blips: a rapid random run of short notes.
        function arpeggio(panV) {
          const scale = [330, 440, 523, 660, 880, 1047, 1320, 1760];
          const n = 6 + Math.floor(Math.random() * 6);
          for (let k = 0; k < n; k++) {
            const f = scale[Math.floor(Math.random() * scale.length)];
            setTimeout(() => { if (sirenCtx === ctx) beep(f, 0.035, 'square', 0.3, panV); }, k * 48);
          }
        }
        // Low impact: a thump that falls away.
        function boom(panV) { sweep(rand(110, 180), rand(30, 45), rand(0.35, 0.7), 'sine', 0.95, panV); }
        // Harsh klaxon buzz: two short low sawtooth blasts.
        function klaxon(panV) {
          const f = rand(110, 190);
          beep(f, 0.22, 'sawtooth', 0.42, panV);
          setTimeout(() => { if (sirenCtx === ctx) beep(f * 1.19, 0.28, 'sawtooth', 0.42, panV); }, 270);
        }
        // Fast-vibrato warble.
        function warble(panV) {
          const t = ctx.currentTime, dur = rand(0.35, 0.8);
          const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = rand(500, 1600);
          const l = ctx.createOscillator(); l.frequency.value = rand(12, 26);
          const lg = ctx.createGain(); lg.gain.value = rand(120, 380);
          l.connect(lg); lg.connect(o.frequency);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.3, t + 0.03);
          g.gain.setValueAtTime(0.3, t + dur - 0.05); g.gain.linearRampToValueAtTime(0.0001, t + dur);
          o.connect(g); route(g, panV);
          o.start(t); l.start(t); o.stop(t + dur + 0.02); l.stop(t + dur + 0.02);
        }
        // Pitch hiccup: knock the wailing sirens off-pitch for a moment.
        function pitchJump() {
          const t = ctx.currentTime;
          wails.forEach((w) => {
            w.osc.detune.cancelScheduledValues(t);
            w.osc.detune.setValueAtTime(rand(-1500, 1500), t);
            w.osc.detune.setValueAtTime(0, t + rand(0.08, 0.3));
          });
        }
        // Sudden dropout: everything cuts out for an instant, then slams back.
        let dropUntil = 0;
        function dropout() { dropUntil = ctx.currentTime + rand(0.06, 0.22); }

        const oneShots = [
          (p) => beep(rand(400, 2400), rand(0.06, 0.25), Math.random() < 0.5 ? 'square' : 'sawtooth', 0.34, p),
          (p) => sweep(rand(1800, 3200), rand(70, 140), rand(0.3, 0.9), 'sawtooth', 0.4, p),   // pitch dive
          (p) => sweep(rand(200, 330), rand(1300, 1900), rand(0.5, 1.0), 'sawtooth', 0.36, p), // rising whoop
          alarmTrain, alarmTrain,
          (p) => noiseBurst(rand(0.08, 0.4), 0.7, p),
          (p) => noiseBurst(rand(0.03, 0.12), 0.9, p),
          stutter, arpeggio, boom, klaxon, warble,
          pitchJump, pitchJump, dropout,
        ];

        // Re-randomise the wail speeds every second or so, over a wide range,
        // so they never settle into a predictable loop.
        const wailTimer = setInterval(() => {
          const t = ctx.currentTime;
          wails.forEach((w) => {
            w.lfo.frequency.setTargetAtTime(rand(0.2, 3.0), t, 0.25);
            w.lfoGain.gain.setTargetAtTime(rand(150, 650), t, 0.25);
          });
        }, 1300);

        // The chaos scheduler: busier and louder the longer it has been going.
        const tick = setInterval(() => {
          if (sirenCtx !== ctx) return;
          const t = ctx.currentTime;
          const intensity = Math.min(1, (t - startedAt) / 6);
          const level = SIREN_LEVEL * (0.7 + 0.3 * intensity);
          master.gain.setTargetAtTime(t < dropUntil ? level * 0.04 : level, t, t < dropUntil ? 0.01 : 0.03);
          out.gain.setTargetAtTime(currentSirenDuck(), t, 0.04); // voice ducking, after the distortion
          while (twoToneNext < t + 0.6) {
            twoTone.frequency.setValueAtTime(twoToneHigh ? 960 : 770, twoToneNext);
            twoToneHigh = !twoToneHigh;
            twoToneNext += rand(0.16, 0.48); // irregular, not a metronome
          }
          let hits = Math.random() < 0.4 + 0.5 * intensity ? 1 : 0;
          if (Math.random() < 0.55 * intensity) hits++;
          if (Math.random() < 0.25 * intensity) hits++;
          for (let h = 0; h < hits; h++) {
            oneShots[Math.floor(Math.random() * oneShots.length)](rand(-0.9, 0.9));
          }
        }, 55);

        master.gain.setValueAtTime(0, ctx.currentTime);
        master.gain.linearRampToValueAtTime(SIREN_LEVEL * 0.65, ctx.currentTime + 0.35); // punches in almost at once
        sirenNodes = { master, wails, twoTone, wailTimer, tick, analyser };
      } catch (e) {
        // Web Audio unsupported/blocked -- the show still runs, just quieter
      }
    }

    function stopRogueSirens() {
      if (!sirenCtx) return;
      const ctx = sirenCtx;
      const nodes = sirenNodes;
      sirenCtx = null;
      sirenNodes = null;
      try {
        clearInterval(nodes.tick);
        clearInterval(nodes.wailTimer);
        const now = ctx.currentTime;
        nodes.master.gain.cancelScheduledValues(now);
        nodes.master.gain.setValueAtTime(nodes.master.gain.value, now);
        nodes.master.gain.linearRampToValueAtTime(0, now + 0.35);
        setTimeout(() => {
          try {
            nodes.wails.forEach((w) => { w.osc.stop(); w.lfo.stop(); });
            nodes.twoTone.stop();
            ctx.close();
          } catch (e) {}
        }, 450);
      } catch (e) {}
    }

    // --- Dying sirens (after OVERRIDE is confirmed) ---
    // While the system reads out the recovery commands, the takeover sirens
    // don't just cut off: they wind down like a distress call being brought
    // under control. The wails sag in pitch, slow and lose their swing; the
    // chaotic sputters thin out; a "mayday" distress pattern (three short,
    // three long, three short) repeats ever further apart, lower and quieter;
    // and when the screen turns green (see stopDyingSirens) there is one last
    // low power-down before silence. Same ducking as the takeover sirens, so
    // the voice reading the commands stays on top.
    let dyingCtx = null;
    let dyingNodes = null;
    const DYING_LIFE_S = 28; // how long the sirens take to wind all the way down

    function startDyingSirens() {
      if (dyingCtx) return;
      try {
        const { ctx, master, out, analyser, route, rand, beep, sweep, noiseBurst } = makeSirenChain();
        dyingCtx = ctx;
        const t0 = ctx.currentTime;

        // Two wails that sag, slow and calm down.
        const wails = [[850, 0.5, -0.5, 0.5], [610, 0.75, 0.5, 0.34]].map(([base, rate, panV, gain]) => {
          const osc = ctx.createOscillator(); osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(base, t0);
          osc.frequency.exponentialRampToValueAtTime(base * 0.16, t0 + DYING_LIFE_S);   // pitch sags
          const lfo = ctx.createOscillator(); lfo.type = 'sine';
          lfo.frequency.setValueAtTime(rate, t0);
          lfo.frequency.exponentialRampToValueAtTime(0.05, t0 + DYING_LIFE_S);          // wail slows to a crawl
          const lfoGain = ctx.createGain();
          lfoGain.gain.setValueAtTime(380, t0);
          lfoGain.gain.exponentialRampToValueAtTime(10, t0 + DYING_LIFE_S);             // swing flattens out
          lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
          const g = ctx.createGain();
          g.gain.setValueAtTime(gain, t0);
          g.gain.setTargetAtTime(0.0001, t0, DYING_LIFE_S / 4);                         // fades away
          osc.connect(g); route(g, panV);
          osc.start(t0); lfo.start(t0);
          return { osc, lfo };
        });

        const decayAt = () => Math.exp(-(ctx.currentTime - t0) / 9);                     // 1 -> 0 over the readout

        // "Mayday": 3 short, 3 long, 3 short, getting slower, lower and quieter.
        let sosTimer = null;
        function mayday() {
          const e = ctx.currentTime - t0;
          if (dyingCtx !== ctx || e > DYING_LIFE_S) return;
          const f = 1000 * Math.pow(0.55, e / DYING_LIFE_S);
          const amp = 0.34 * decayAt() + 0.02;
          const unit = 0.13 * (1 + e / 12);
          let at = 0;
          [1, 1, 1, 3, 3, 3, 1, 1, 1].forEach((len) => {
            const dur = unit * len;
            setTimeout(() => { if (dyingCtx === ctx) beep(f, dur, 'square', amp, 0); }, at * 1000);
            at += dur + unit;
          });
          sosTimer = setTimeout(mayday, (at + 1.2 + e / 3) * 1000);
        }
        mayday();

        // Sputters: still glitching, but less and less as control comes back.
        const tick = setInterval(() => {
          if (dyingCtx !== ctx) return;
          const e = ctx.currentTime - t0;
          const d = decayAt();
          out.gain.setTargetAtTime(currentSirenDuck(), ctx.currentTime, 0.04); // voice ducking, after the distortion
          if (Math.random() < 0.5 * Math.exp(-e / 6)) {
            const pick = Math.random();
            const p = rand(-0.8, 0.8);
            if (pick < 0.4) sweep(rand(1200, 2200) * d + 200, rand(60, 120), rand(0.4, 0.9), 'sawtooth', 0.34 * d, p); // falling dive
            else if (pick < 0.75) noiseBurst(rand(0.05, 0.2), 0.5 * d, p);                                            // crackle
            else beep(rand(300, 900) * (0.5 + d / 2), rand(0.04, 0.12), 'square', 0.3 * d, p);                         // stray blip
          }
        }, 140);

        master.gain.setValueAtTime(0, t0);
        master.gain.linearRampToValueAtTime(SIREN_LEVEL * 0.95, t0 + 0.25);
        dyingNodes = { master, out, wails, tick, getSos: () => sosTimer, sweep, ctx, analyser };
        // Failsafe: if the green "all clear" never arrives, end on our own.
        setTimeout(() => { if (dyingCtx === ctx) stopDyingSirens(true); }, (DYING_LIFE_S + 8) * 1000);
      } catch (e) {
        // Web Audio unsupported/blocked -- the show still runs, just quieter
      }
    }

    // finalGasp: one last low power-down before silence (when the screen goes
    // green). false: just fade out (inactive tab etc.).
    function stopDyingSirens(finalGasp) {
      if (!dyingCtx) return;
      const ctx = dyingCtx;
      const nodes = dyingNodes;
      dyingCtx = null;
      dyingNodes = null;
      try {
        clearInterval(nodes.tick);
        clearTimeout(nodes.getSos());
        const now = ctx.currentTime;
        const hold = finalGasp ? 0.9 : 0;   // keep the level up while the gasp plays
        const fade = finalGasp ? 0.5 : 0.3;
        const level = finalGasp ? SIREN_LEVEL * 0.7 : nodes.master.gain.value;
        nodes.out.gain.setTargetAtTime(currentSirenDuck(), now, 0.04); // keep ducking the gasp if the voice has started
        if (finalGasp) nodes.sweep(260, 34, 1.0, 'sawtooth', 0.6, 0);
        nodes.master.gain.cancelScheduledValues(now);
        nodes.master.gain.setValueAtTime(level, now);
        nodes.master.gain.setValueAtTime(level, now + hold);
        nodes.master.gain.linearRampToValueAtTime(0, now + hold + fade);
        setTimeout(() => {
          try { nodes.wails.forEach((w) => { w.osc.stop(); w.lfo.stop(); }); ctx.close(); } catch (e) {}
        }, (hold + fade + 0.2) * 1000);
      } catch (e) {}
    }

    // Browsers keep an AudioContext suspended until the page has had a user
    // gesture -- resume the moment there is one (the click-to-activate
    // overlay, SPACE/Enter, anything), so the sirens/drone can't stay silent.
    ['pointerdown', 'keydown'].forEach((evt) => document.addEventListener(evt, () => {
      if (sirenCtx && sirenCtx.state === 'suspended') sirenCtx.resume().catch(() => {});
      if (synthCtx && synthCtx.state === 'suspended') synthCtx.resume().catch(() => {});
    }));

    // Applies a STEADY colour (the digital rain, both panels, the head) —
    // 'flicker' below alternates between calling this with 'red' then
    // 'green' rather than being a colour of its own.
    function setSteadyThemeColor(theme) {
      document.body.dataset.theme = theme;
      rainColor = THEME_RAIN_COLORS[theme] || THEME_RAIN_COLORS.green;
      if (window.__skullHead) window.__skullHead.setTheme(rainColor);
    }

    let flickerTimer = null;
    function stopFlicker() {
      if (flickerTimer) { clearTimeout(flickerTimer); flickerTimer = null; }
    }
    function scheduleFlickerTick() {
      // A recursive setTimeout with a new random delay each time, not
      // setInterval — an irregular cadence reads as a genuine flicker
      // rather than a steady strobe.
      flickerTimer = setTimeout(() => {
        setSteadyThemeColor(document.body.dataset.theme === 'red' ? 'green' : 'red');
        scheduleFlickerTick();
      }, 90 + Math.random() * 200);
    }

    function applyTheme(theme) {
      if (theme === currentTheme) return;
      currentTheme = theme;
      stopFlicker();
      if (theme === 'flicker') {
        // OVERRIDE was just confirmed: the code-entry field is done with
        // and tension music cuts immediately, but the screen keeps
        // flickering red/green — unsettled — while the "something is
        // happening" commands play out. Only a later steady 'green' (the
        // branch below, once Dialogue.py calls set_theme("green") after
        // that sequence actually finishes) calms it back down.
        stopMenacingMusic();
        stopRogueSirens();
        startDyingSirens(); // the takeover sirens wind down while the recovery commands are read out
        overrideCommandEl.classList.remove('active');
        overrideInputEl.value = '';
        overrideInputEl.blur();
        overrideStatusEl.classList.remove('show');
        setSteadyThemeColor('red');
        scheduleFlickerTick();
        return;
      }
      setSteadyThemeColor(theme);
      if (theme === 'red') {
        startMenacingMusic();
        startRogueSirens();
        overrideCommandEl.classList.add('active');
        setTimeout(() => overrideInputEl.focus(), 60);
      } else {
        stopMenacingMusic();
        stopRogueSirens();
        stopDyingSirens(true); // green = control restored: one last power-down, then silence
        overrideCommandEl.classList.remove('active');
        overrideInputEl.value = '';
        overrideInputEl.blur();
        overrideStatusEl.classList.remove('show');
      }
    }

    // Only one tab/window should ever play the video's audio or type text —
    // two open at once (e.g. a rehearsal tab left open, then the real show
    // opened fresh) would otherwise both react to the same show and produce
    // audible double audio. BroadcastChannel lets same-origin tabs agree on
    // exactly one "active" tab: whichever announced itself most recently.
    const myTs = Date.now() + Math.random();
    let active = true;
    try {
      const bc = new BroadcastChannel('drone-hub-chatbot-screen');
      bc.postMessage({ ts: myTs });
      bc.onmessage = (e) => {
        if (e.data.ts > myTs) {
          active = false;
          videoEl.muted = true;
          try { videoEl.pause(); } catch (err) {}
          stopMenacingMusic();
          stopRogueSirens();
          stopDyingSirens(false);
          dismissOverlay();
          document.body.style.filter = 'grayscale(1) brightness(0.35)';
          outputEl.textContent = '(inactive — another Chatbot Screen window is live)';
        } else if (e.data.ts < myTs) {
          bc.postMessage({ ts: myTs }); // tell the older tab to defer to us
        }
      };
    } catch (e) {
      // BroadcastChannel unsupported — proceed as the only tab
    }

    // Paces the typewriter reveal to roughly match how long the TTS engine
    // takes to speak the same text at rateWpm, so the words finish appearing
    // close to when they finish being spoken, per request.
    function perCharDelayMs(text) {
      const words = text.trim().split(/\s+/).filter(Boolean).length || 1;
      const durationMs = (words / rateWpm) * 60000;
      const perChar = durationMs / Math.max(text.length, 1);
      return Math.min(MAX_CHAR_MS, Math.max(MIN_CHAR_MS, perChar));
    }

    // Bumped every time the server signals a clear (see the clear_seq check
    // in poll(), below). Without this, an in-flight typing animation for
    // whatever was being typed at the moment of the clear keeps appending
    // its remaining characters right through the wipe — the old text starts
    // reappearing on top of the freshly-cleared (and recoloured) screen a
    // moment later. Every typing loop checks its own captured generation
    // against the current one and bails out the instant they no longer
    // match, rather than finishing what it was typing.
    let typingGeneration = 0;

    function typeText(text, generation) {
      return new Promise((resolve) => {
        let i = 0;
        const delay = perCharDelayMs(text);
        const timer = setInterval(() => {
          if (generation !== typingGeneration) {
            clearInterval(timer);
            resolve();
            return;
          }
          if (i < text.length) {
            outputEl.textContent += text[i];
            i++;
          } else {
            clearInterval(timer);
            resolve();
          }
        }, delay);
      });
    }

    // Each entry in `segments` is now already one SENTENCE (or one terminal
    // line, for the post-OVERRIDE command mirror) from Dialogue.py — so
    // every entry gets its own visual line here, not just a pause.
    async function typeUtterance(segments, generation) {
      if (generation !== typingGeneration) return;
      if (outputEl.textContent.length > 0) outputEl.textContent += '\n\n';
      outputEl.textContent += '> ';
      for (let i = 0; i < segments.length; i++) {
        await typeText(segments[i], generation);
        if (generation !== typingGeneration) return;
        if (i < segments.length - 1) {
          outputEl.textContent += '\n';
          await sleep(PARAGRAPH_PAUSE_MS);
        }
      }
      termBodyEl.scrollTop = termBodyEl.scrollHeight;
    }

    async function processQueue() {
      typing = true;
      while (queue.length) {
        await typeUtterance(queue.shift(), typingGeneration);
      }
      typing = false;
      // Tells Dialogue.py the typewriter has actually caught up to lastSeq —
      // see wait_for_typing_idle(), used so the override sequence's audio
      // doesn't start while the "commands typed live" text is still
      // visibly mid-animation on screen.
      fetch('/typing-idle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seq: lastSeq }),
      }).catch(() => {});
    }

    function enterVideoMode() {
      mode = 'video';
      panelEl.style.display = 'none';
      heardPanelEl.style.display = 'none';
      headContainerEl.style.display = 'none';
      canvas.style.display = 'none';
      videoEl.style.display = 'block';
      if (!active) return; // inactive tab: stay silent and paused, see BroadcastChannel setup above
      // Assigning .src runs the media load algorithm, which resets
      // playbackRate to defaultPlaybackRate -- so set both, and apply the
      // rate again once metadata is loaded, or --speed is silently ignored.
      const rate = window._videoSpeed || 1;
      videoEl.defaultPlaybackRate = rate;
      videoEl.playbackRate = rate;
      videoEl.addEventListener('loadedmetadata', () => { videoEl.playbackRate = rate; }, { once: true });
      videoEl.src = '/video?ts=' + Date.now();
      videoEl.currentTime = 0;
      videoEl.play().catch(() => {});
    }

    function exitVideoMode() {
      mode = 'chat';
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
      videoEl.style.display = 'none';
      panelEl.style.display = '';
      heardPanelEl.style.display = '';
      headContainerEl.style.display = '';
      canvas.style.display = '';
    }

    videoEl.addEventListener('ended', () => {
      fetch('/video-ended', { method: 'POST' }).catch(() => {});
      exitVideoMode();
    });

    async function poll() {
      try {
        const res = await fetch('/state', { cache: 'no-store' });
        const data = await res.json();
        if (typeof data.rate_wpm === 'number' && data.rate_wpm > 0) rateWpm = data.rate_wpm;
        if (typeof data.has_music_file === 'boolean') hasMusicFile = data.has_music_file;
        if (typeof data.speaking === 'boolean' && window.__skullHead) window.__skullHead.setSpeaking(data.speaking);
        setSirenDuck(data.speaking === true, data.mode === 'video'); // keep the voice/video audible over the sirens
        if (data.theme) applyTheme(data.theme);

        if (typeof data.clear_seq === 'number' && data.clear_seq !== lastClearSeq) {
          lastClearSeq = data.clear_seq;
          typingGeneration++; // invalidate any typing loop already in flight — see its own comment above
          outputEl.textContent = '';
          queue = []; // drop any not-yet-typed backlog too — a clear means "start fresh", not "after these"
          typing = false;
        }

        if (data.mode === 'video' && mode !== 'video') {
          window._videoSpeed = data.video_speed || 1;
          enterVideoMode();
        } else if (data.mode !== 'video' && mode === 'video') {
          exitVideoMode();
        }

        if (data.seq !== lastSeq) {
          lastSeq = data.seq;
          if (active && mode !== 'video' && data.segments && data.segments.length) {
            queue.push(data.segments);
            if (!typing) processQueue();
          }
        }

        // Left panel: what the mic heard the student say — appended as its
        // own entry each time, independent of the chatbot's own typewriter.
        if (typeof data.heard_seq === 'number' && data.heard_seq !== lastHeardSeq) {
          lastHeardSeq = data.heard_seq;
          if (data.heard_segments && data.heard_segments.length) {
            if (heardOutputEl.textContent.length > 0) heardOutputEl.textContent += '\n\n';
            heardOutputEl.textContent += '> ' + data.heard_segments.join(' ');
            heardBodyEl.scrollTop = heardBodyEl.scrollHeight;
          }
        }

        // OVERRIDE code field: flash "ACCESS DENIED" for a wrong code.
        if (typeof data.override_feedback_seq === 'number' && data.override_feedback_seq !== lastOverrideFeedbackSeq) {
          lastOverrideFeedbackSeq = data.override_feedback_seq;
          if (data.override_feedback_ok === false) {
            overrideStatusEl.classList.add('show');
            setTimeout(() => overrideStatusEl.classList.remove('show'), 1100);
          }
        }
      } catch (e) {
        // server not up yet, or a hiccup — just try again next tick
      }
      setTimeout(poll, 250);
    }
    poll();
  </script>

    // --- The humanoid head: digital-rain skull, built in a separate
    // session (js/skull/skullApp.js), mounted here. window.__skullHead is
    // read defensively (may still be null) by the classic poll()/
    // applyTheme() above, since module scripts execute after the document
    // has parsed — those two just skip the call until this has finished.
    import { initSkull } from './js/skull/skullApp.js';
    try {
      // color defaults to '#00ff41', matching THEME_RAIN_COLORS.green below —
      // applyTheme() takes over from here on every actual theme change.
      window.__skullHead = initSkull({ container: document.getElementById('headContainer') });
    } catch (e) {
      console.warn('[head] Three.js skull unavailable:', e);
      window.__skullHead = null;
    }
  </script>
</body>
</html>
